# Committed to Git (safe configs)
# Application Name
spring.application.name=TickIT Ticketing System

# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tickit
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Expose sepecific endpoints (health, info, metrics, etc)
management.endpoints.web.exposure.include=*

# Enable actuator endpoints
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Customize the base path for actuator endpoints
management.endpoints.web.base-path=/actuator

# Set default logging level to INFO (or WARN)
logging.level.root=WARN

# Fine-tune specific packages:
logging.level.com.sofrecom.tickit=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Import secrets from application-secrets.properties
spring.config.import=optional:classpath:application-secrets.properties

