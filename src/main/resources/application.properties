# Committed to Git (safe configs)
# Application Name
spring.application.name=TickIT Ticketing System

# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tickit
# spring.datasource.url=jdbc:postgresql://localhost:5432/bli
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Configuration
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Expose sepecific endpoints (health, info, metrics, etc)
management.endpoints.web.exposure.include=*

# Enable actuator endpoints
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Customize the base path for actuator endpoints
management.endpoints.web.base-path=/actuator

# Set default logging level to INFO (or WARN)
logging.level.root=WARN

# Fine-tune specific packages:
logging.level.com.sofrecom.tickit=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Import secrets from application-secrets.properties
spring.config.import=optional:classpath:application-secrets.properties

# Swagger UI Configuration
# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
# API docs path
springdoc.api-docs.path=/api-docs
# Enable/disable API docs
springdoc.api-docs.enabled=true
# Enable/disable Swagger UI
springdoc.swagger-ui.enabled=true

# LLM Configuration
llm.endpoint=http://localhost:11434/v1/chat/completions
llm.model=nous-hermes2