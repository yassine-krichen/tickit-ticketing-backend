services:
    backend:
        build: .
        ports:
            - "8080:8080"
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tickit
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: root
            LLM_ENDPOINT: http://host.docker.internal:11434/v1/chat/completions
            LLM_MODEL: hermes3:3b
            SPRING_PROFILES_ACTIVE: docker
        depends_on:
            - db
        volumes:
            - ./src/main/resources/application-secrets.properties:/app/application-secrets.properties:ro
            - ./uploads:/app/uploads
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    db:
        image: postgres:11.9
        restart: always
        environment:
            POSTGRES_DB: tickit
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: root
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
